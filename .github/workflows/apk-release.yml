name: APK release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/android-ci.yml
    secrets:
      debug_keystore: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check tag matches APK version
        env:
          BUILD_VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "v$BUILD_VERSION" ]]; then
            echo "The release tag must match the version in app/build.gradle.kts."
            exit 1
          fi

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: link-ferry-debug

      - name: Publish APK on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          asset="link-ferry-$tag-debug.apk"
          mv app-debug.apk "$asset"

          if gh release view "$tag" --json assets > "$RUNNER_TEMP/release-assets.json"; then
            if jq -e --arg name "$asset" 'any(.assets[]; .name == $name)' "$RUNNER_TEMP/release-assets.json" > /dev/null; then
              echo "The release already has this APK."
              exit 0
            fi
            gh release upload "$tag" "$asset"
          else
            gh release create "$tag" "$asset" --verify-tag --generate-notes
          fi
